name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare le release quando si crea un tag v*

jobs:
  macos:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configura (universal binary arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test del modello
        run: ./build/Release/network_test

      - name: Validazione Audio Unit (auval)
        continue-on-error: true
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Kt69 Clfx

      - name: Firma ad-hoc e pacchetto
        run: |
          A=build/DB69_artefacts/Release
          mkdir -p "dist/KTDB-69"
          cp -R "$A/VST3/KTDB-69.vst3" "$A/AU/KTDB-69.component" "$A/Standalone/KTDB-69.app" "dist/KTDB-69/"
          for p in "dist/KTDB-69/"*; do codesign --force --deep --sign - "$p"; done
          cp scripts/installa.command "dist/KTDB-69/Installa KTDB-69.command"
          chmod +x "dist/KTDB-69/Installa KTDB-69.command"
          cp README.md "dist/KTDB-69/"
          cp docs/Manuale-KTDB-69.pdf "dist/KTDB-69/"
          lipo -info "dist/KTDB-69/KTDB-69.vst3/Contents/MacOS/KTDB-69"
          (cd dist && ditto -c -k --keepParent "KTDB-69" ../KTDB69-macOS.zip)

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: KTDB69-macOS
          path: KTDB69-macOS.zip

      - name: Pubblica la release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" KTDB69-macOS.zip \
            --title "KTDB-69 ${GITHUB_REF_NAME}" \
            --notes "Build macOS universale (Apple Silicon e Intel) con VST3, AU e Standalone."
